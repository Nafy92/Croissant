<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Croissant Gallery | See Our Freshly Baked Pastries | Croissant Bakery
    </title>
    <meta
      name="description"
      content="View our gallery of freshly baked French croissants. See our butter, chocolate, almond, and savory croissants made with traditional techniques."
    />
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <header>
      <h1>Croissant Bakery</h1>
      <nav>
        <ul>
          <li><a href="./index.html">Home</a></li>
          <li><a href="./photo.html" class="active">Gallery</a></li>
          <li><a href="./contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Our Fresh Croissants</h2>

      <div class="gallery">
        <div class="photo-container">
          <img
            src="images/Fresh baked croissant.jpg"
            alt="Fresh baked croissant"
            class="gallery-image"
          />
          <p class="caption">
            Our signature butter croissants, fresh from the oven
          </p>
        </div>

        <div class="photo-container">
          <img
            src="images/Chocolate croissant.jpg"
            alt="Chocolate croissant"
            class="gallery-image"
          />
          <p class="caption">
            Chocolate-filled croissants, a customer favorite
          </p>
        </div>

        <div class="photo-container">
          <img
            src="images/Almond croissant.jpg"
            alt="Almond croissant"
            class="gallery-image"
          />
          <p class="caption">Almond croissants dusted with powdered sugar</p>
